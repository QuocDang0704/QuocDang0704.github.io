<header class="site-header" id="siteHeader">
  <div class="container nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">{ }</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Mở menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="siteNav">
      <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Trang chủ</a>
      <a href="{{ '/library/' | relative_url }}" class="nav-link {% if page.url contains '/library' %}active{% endif %}">Thư viện</a>
      <a href="{{ '/learning/' | relative_url }}" class="nav-link {% if page.url contains '/learning' %}active{% endif %}">Học hỏi</a>
      <a href="{{ '/entertainment/' | relative_url }}" class="nav-link {% if page.url contains '/entertainment' %}active{% endif %}">Giải trí</a>
      <a href="{{ '/about/' | relative_url }}" class="nav-link {% if page.url contains '/about' %}active{% endif %}">Giới thiệu</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Đổi giao diện sáng/tối">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
